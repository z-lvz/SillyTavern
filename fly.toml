# fly.toml app configuration file generated for sillytavern-z on 2025-04-29T17:10:40Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sillytavern-z'
primary_region = 'hkg'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type       = "connections"
    soft_limit = 99999
    hard_limit = 9999999999

